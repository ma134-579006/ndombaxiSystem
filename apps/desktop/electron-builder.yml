# Instalador Windows do Ndombaxi System — build MODERNO (Windows 10 e 11).
#
# "Instalar num clique, sem dependências" traduz-se em decisões concretas:
#   • O Electron traz o seu próprio Chromium e Node — não se instala .NET, VC++
#     nem runtime nenhum.
#   • O better-sqlite3 é compilado para esta versão do Electron e vai dentro do
#     pacote — não há motor de base de dados para instalar à parte.
#   • `oneClick: false` com `allowToChangeInstallationDirectory` dá ao lojista um
#     assistente normal, o que ele espera de software sério, sem o obrigar a
#     decidir nada: Seguinte, Seguinte, Concluir.
appId: com.ndombaxi.system
productName: Ndombaxi System
copyright: © Ndombaxi System

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

extraResources:
  # Os frontends compilados (Gestão e Caixa). Vão para `resources/modules` e são
  # servidos pelo protocolo ndombaxi:// — a app abre e funciona sem rede nenhuma.
  - from: resources/modules
    to: modules

# O better-sqlite3 já vem compilado para o ABI do Electron 33 (ver 13-Scripts,
# `prebuild-install --runtime=electron`). Deixamos o electron-builder tentar
# reconstruí-lo aqui traria dois problemas: percorre TODO o workspace pnpm e
# rebenta no primeiro symlink de uma dependência de testes que não esteja
# instalada, e exigiria descarregar o toolchain outra vez sem necessidade.
npmRebuild: false
nodeGypRebuild: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      # x64 cobre praticamente todo o parque de PCs Windows em Angola.
      # Para acrescentar ARM64 (Surface e portáteis Snapdragon), basta juntar
      # `arm64` aqui — implica descarregar mais ~115 MB de runtime Electron.
      arch: [x64]
  # Sem assinatura de código configurada, o SmartScreen mostra um aviso na
  # primeira instalação. Resolve-se com um certificado EV — ver 06-Documentacao.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false          # instala no perfil do utilizador → não pede admin
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ndombaxi System
  # NÃO fixamos installerIcon/uninstallerIcon aqui. Essas opções do NSIS exigem
  # um ficheiro .ico e são passadas em BRUTO ao makensis (não são convertidas).
  # Deixamos o electron-builder derivar os ícones do instalador a partir do
  # mesmo .ico que já gera de `win.icon` para o executável — uma só fonte de
  # verdade para o ícone, sem termos de manter um .ico à parte no repositório.
  # Ao desinstalar, os dados do posto NÃO são apagados: uma desinstalação
  # acidental não pode levar consigo vendas que ainda não subiram. A limpeza
  # completa é uma decisão explícita, documentada no manual.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: NdombaxiSystem-Setup-${version}-${arch}.${ext}
  uninstallDisplayName: Ndombaxi System
