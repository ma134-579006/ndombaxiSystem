<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <!--
    LANÇADOR — o primeiro ecrã da aplicação. Escolher Gestão ou Caixa.
    Fundo tecnológico ANIMADO em CSS puro (grelha + orbes de luz): profissional
    mas LEVE — sem vídeo, para não pesar no arranque. De dentro de cada módulo,
    a seta de voltar (injetada pelo shell) regressa aqui para trocar.
    A CSP é restritiva de propósito: este ecrã não carrega nada de fora.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self';" />
  <title>Ndombaxi System</title>
  <style>
    :root {
      --brand-500: #4353ff;
      --brand-600: #2430e8;
      --shop-600:  #ff4d2d;
      --gray-950:  #060a15;
      --gray-400:  #94a3b8;
      --gray-200:  #e2e8f0;
      --radius-lg: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--gray-950);
      color: var(--gray-200);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
      position: relative;
    }

    /* ── Fundo tecnológico animado (leve: transform/opacity, GPU) ── */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .grid-bg {
      position: absolute; inset: -2px;
      background-image:
        linear-gradient(rgba(67, 83, 255, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(67, 83, 255, .07) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(ellipse 78% 62% at 50% 42%, #000 38%, transparent 100%);
              mask-image: radial-gradient(ellipse 78% 62% at 50% 42%, #000 38%, transparent 100%);
      animation: gridpan 38s linear infinite;
    }
    @keyframes gridpan { from { background-position: 0 0; } to { background-position: 46px 46px; } }

    .orb { position: absolute; border-radius: 50%; filter: blur(64px); opacity: .55; will-change: transform; }
    .orb.a { width: 540px; height: 540px; top: -140px; left: -90px;
             background: radial-gradient(circle, rgba(67, 83, 255, .55), transparent 68%);
             animation: drift1 24s ease-in-out infinite; }
    .orb.b { width: 460px; height: 460px; bottom: -120px; right: -60px;
             background: radial-gradient(circle, rgba(36, 48, 232, .5), transparent 68%);
             animation: drift2 30s ease-in-out infinite; }
    .orb.c { width: 320px; height: 320px; top: 40%; left: 60%;
             background: radial-gradient(circle, rgba(255, 77, 45, .22), transparent 70%);
             animation: drift3 34s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px, 40px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px, -30px); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px, 50px); } }

    /* Brilho de topo, subtil, por cima da grelha. */
    .glow-top { position: absolute; inset: 0;
      background: radial-gradient(1100px 520px at 50% -12%, rgba(67, 83, 255, .18), transparent 70%); }

    .wrap { position: relative; z-index: 1; width: min(820px, 92vw); text-align: center; }

    .logo {
      width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 22px; display: block;
      box-shadow: 0 18px 54px rgba(36, 48, 232, .4);
      animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
    }
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -.02em; color: #fff;
         animation: rise .6s cubic-bezier(.2,.8,.2,1) .06s both; }
    .sub { margin-top: 8px; font-size: 15px; color: var(--gray-400);
           animation: rise .6s cubic-bezier(.2,.8,.2,1) .12s both; }

    .grid {
      margin-top: 40px; display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 18px; max-width: 620px; margin-inline: auto;
    }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

    .card {
      position: relative; background: rgba(255, 255, 255, .045);
      border: 1px solid rgba(255, 255, 255, .1); border-radius: var(--radius-lg);
      padding: 28px 22px; cursor: pointer; text-align: left; color: inherit; font: inherit;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s ease, background .18s ease, box-shadow .18s ease;
      animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
    }
    .grid .card:nth-child(1) { animation-delay: .18s; }
    .grid .card:nth-child(2) { animation-delay: .24s; }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px); border-color: rgba(67, 83, 255, .6);
      background: rgba(67, 83, 255, .12); box-shadow: 0 16px 40px rgba(36, 48, 232, .25); outline: none;
    }
    .card:focus-visible { box-shadow: 0 0 0 3px rgba(67, 83, 255, .4); }
    .card.pos:hover, .card.pos:focus-visible { border-color: rgba(255, 77, 45, .55); background: rgba(255, 77, 45, .1); box-shadow: 0 16px 40px rgba(255, 77, 45, .2); }

    .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
            margin-bottom: 14px; background: rgba(67, 83, 255, .18); }
    .card.pos .icon { background: rgba(255, 77, 45, .18); }
    .icon svg { width: 23px; height: 23px; stroke: var(--brand-500); fill: none;
                stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .card.pos .icon svg { stroke: var(--shop-600); }
    .card h2 { font-size: 17px; font-weight: 650; color: #fff; }
    .card p  { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--gray-400); }
    .card .go { position: absolute; top: 24px; right: 22px; color: #64748b; transition: transform .18s ease, color .18s ease; }
    .card:hover .go { transform: translateX(3px); color: #fff; }

    .foot { margin-top: 32px; font-size: 12px; color: #5b6883;
            animation: rise .6s cubic-bezier(.2,.8,.2,1) .36s both; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .grid-bg, .orb { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid-bg"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="glow-top"></div>
  </div>

  <main class="wrap">
    <img class="logo" src="/logo.png" alt="Ndombaxi System" />
    <h1>Ndombaxi System</h1>
    <p class="sub">Escolha por onde quer começar.</p>

    <div class="grid">
      <button class="card" data-module="gestao">
        <span class="go" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/></svg>
        </span>
        <h2>Painel de Gestão</h2>
        <p>Produtos, stock, clientes, relatórios e configuração da empresa.</p>
      </button>

      <button class="card pos" data-module="caixa">
        <span class="go" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 11h20M6 15h4"/></svg>
        </span>
        <h2>Caixa (POS)</h2>
        <p>Terminal de venda com emissão fiscal AGT. Funciona sem internet.</p>
      </button>
    </div>

    <p class="foot">Os seus dados ficam guardados neste computador e sincronizam sozinhos quando houver internet.</p>
  </main>

  <script src="./launcher.js"></script>
</body>
</html>
