      <rect x="158" y="116" width="112" height="150" rx="14" fill="#fff"/><rect x="170" y="128" width="88" height="78" rx="10" fill="#dff7eb"/>
      <rect x="196" y="146" width="36" height="44" rx="8" fill="url(#bag2)"/><rect x="204" y="140" width="20" height="10" rx="4" fill="#00a650"/>
      <rect x="170" y="216" width="70" height="10" rx="5" fill="#c9cdf5"/><rect x="170" y="236" width="48" height="14" rx="7" fill="#1a24c4"/>
      <rect x="30" y="282" width="112" height="150" rx="14" fill="#fff"/><rect x="42" y="294" width="88" height="78" rx="10" fill="#e6e9ff"/>
