<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#080d1a" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <!-- Sora + DM Sans são AUTO-HOSPEDADAS (public/fonts) para a app ser 100 %
         idêntica ao site mesmo OFFLINE — sem elas, offline caía na fonte do
         sistema. Só a Noto Emoji fica no Google (é pesada e é apenas fallback de
         emoji, com o emoji do sistema como reserva quando não há rede). -->
    <!-- Pré-carrega as fontes latinas (Sora + DM Sans): evita o salto de layout quando chegam (CLS). -->
    <link rel="preload" href="/fonts/nx03.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nx01.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/ndombaxi-fonts.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="description" content="LPS Vendas — sistema de gestão e vendas: POS, stock, facturação certificada AGT, financeiro e loja online, em Kwanzas." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LPS Vendas" />
    <meta property="og:title" content="LPS Vendas — gestão e vendas para Angola" />
    <meta property="og:description" content="POS, stock, facturação certificada AGT, financeiro e loja online numa única plataforma." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LPS Vendas" />
    <title>LPS Vendas — Administração</title>
  </head>
  <body>
    <div id="root"><div style="position:fixed;inset:0;display:grid;place-items:center;background:#0b1020"><div style="display:grid;justify-items:center;gap:14px;color:#fff;font:14px system-ui,sans-serif"><div style="position:relative;width:150px;height:150px"><div style="position:absolute;inset:7px;border-radius:999px;background:#fff"></div><img src="/logo.png" alt="" style="position:absolute;left:9%;top:50%;width:82%;transform:translateY(-50%)"><div style="position:absolute;inset:0;border-radius:999px;border:4px solid transparent;border-top-color:#fff;border-right-color:#fff;animation:bootspin 1.2s cubic-bezier(.5,.1,.5,.9) infinite"></div><div style="position:absolute;inset:2px;border-radius:999px;border:4px solid transparent;border-bottom-color:#3b5bff;border-left-color:#3b5bff;animation:bootspin 1.8s linear infinite reverse"></div></div><span>A carregar…</span></div></div><style>@keyframes bootspin{to{transform:rotate(360deg)}}</style></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
