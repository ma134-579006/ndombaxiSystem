    <!-- Sora + DM Sans são AUTO-HOSPEDADAS (public/fonts) para a app ser 100 %
         idêntica ao site mesmo OFFLINE — sem elas, offline caía na fonte do
         sistema. Só a Noto Emoji fica no Google (é pesada e é apenas fallback de
         emoji, com o emoji do sistema como reserva quando não há rede). -->
    <!-- Pré-carrega as fontes latinas (Sora + DM Sans): evita o salto de layout quando chegam (CLS). -->
    <link rel="preload" href="/fonts/nx03.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nx01.woff2" as="font" type="font/woff2" crossorigin />
