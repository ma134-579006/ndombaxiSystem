name: Keep API warm

# ════════════════════════════════════════════════════════════════════════════
# PROBLEMA: a API corre no plano FREE do Render, que ADORMECE após ~15 min sem
# tráfego e demora ~30-50s a acordar no 1.º pedido seguinte. Efeito visível: ao
# publicar/partilhar a loja online, o primeiro visitante apanha esse cold start
# e "a loja demora muito para ficar disponível".
#
# SOLUÇÃO: este workflow faz um ping periódico a /health, mantendo a instância
# acordada — assim a loja abre quase instantaneamente para os clientes.
#
# LIMITAÇÃO HONESTA: o agendador (cron) do GitHub Actions é "best-effort" e por
# vezes atrasa alguns minutos em picos de carga, pelo que raras vezes ainda pode
# escapar um cold start. Para eliminação total do sono, um plano pago do Render
# (Starter) ou um Cloudflare Worker cron são mais determinísticos.
#
# CONFIGURAÇÃO: por defeito faz ping ao serviço de imagem vivo. Para apontar a
# outra URL sem editar este ficheiro, define a variável de repositório
# `KEEP_WARM_URL` (Settings → Secrets and variables → Actions → Variables).
# ════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 minutos (< janela de 15 min do Render free)
  workflow_dispatch: {}

# Se um ping ainda estiver a decorrer (a acordar a instância), não empilha outro.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (acorda e mantém a API quente)
        env:
          BASE_URL: ${{ vars.KEEP_WARM_URL || 'https://ndombaxi-api-img.onrender.com' }}
        run: |
          set -u
          URL="${BASE_URL%/}/health"
          echo "Ping keep-warm → $URL"
          # Até 6 tentativas com pausa: se a instância estava a dormir, o 1.º
          # pedido inicia o arranque (~30-50s); repetimos até responder 200.
          for i in $(seq 1 6); do
            start=$(date +%s)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              -H 'origin: https://ndombaxisystem.com' "$URL" || echo 000)
            took=$(( $(date +%s) - start ))
            echo "  tentativa $i: HTTP $code em ${took}s"
            if [ "$code" = "200" ]; then
              echo "API acordada e a responder. ✓"
              exit 0
            fi
            sleep 15
          done
          # Não falha o workflow com ruído vermelho: o objetivo (enviar tráfego
          # que acorda a instância) foi cumprido mesmo que o 200 tarde a chegar.
          echo "::warning::A API não devolveu 200 dentro do tempo — pode estar a acordar. O ping foi enviado."
