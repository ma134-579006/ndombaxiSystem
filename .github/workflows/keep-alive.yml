name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Só um loop de cada vez: o cron (a cada 5 min) fica em fila e arranca quando
# o anterior termina, por isso o ping nunca fica muito tempo sem correr.
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping loop (a cada 10 s durante ~5h40)
        run: |
          URL=https://ndombaxi-api-3nmz.onrender.com/health
          END=$((SECONDS + 20400))
          while [ $SECONDS -lt $END ]; do
            curl -sS -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 60 "$URL" || echo "falhou"
            sleep 10
          done
      - name: Relançar o loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-alive.yml --repo "$GITHUB_REPOSITORY" || true
