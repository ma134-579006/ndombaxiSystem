# Compila o APK Android (LPS Vendas) na nuvem (Ubuntu + JDK 17 + Android SDK).
# Sem secrets → APK de DEBUG (instalável para testes). Para publicar na Play Store
# é preciso uma keystore própria (não incluída).
name: Android build

on:
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NDOMBAXI_API_URL: https://ndombaxi-api-3nmz.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Compilar pacotes partilhados
        run: |
          pnpm --filter @nexus/types build
          pnpm --filter @nexus/update-core build
          pnpm --filter @nexus/shop-link build
      - name: Preparar web e projeto Android
        run: |
          node apps/mobile-shell/scripts/prepare-web.mjs
          pnpm --filter @nexus/mobile-shell exec cap add android || true
          pnpm --filter @nexus/mobile-shell exec cap sync android
          # Ícones a partir do logótipo único (apps/web/public/logo.png, sem fundo).
          node apps/mobile-shell/scripts/gen-android-icons.mjs
          # Ecrã inteiro (imersivo): sem barra de estado nem de navegação.
          node apps/mobile-shell/scripts/patch-android.mjs
      - name: Assinatura estável
        # Cada runner criava uma debug.keystore NOVA → cada APK tinha assinatura
        # diferente e o Android recusava instalar por cima da versão anterior
        # ("App não instalada"). Usamos sempre a mesma chave de depuração.
        run: |
          mkdir -p ~/.android
          cp apps/mobile-shell/keystore/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK debug
        working-directory: apps/mobile-shell/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ndombaxi-android-debug
          path: apps/mobile-shell/android/app/build/outputs/apk/debug/*.apk
