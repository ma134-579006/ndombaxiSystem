# Compila o APK Android (LPS Vendas) na nuvem (Ubuntu + JDK 17 + Android SDK).
# Sem secrets → APK de DEBUG (instalável para testes). Para publicar na Play Store
# é preciso uma keystore própria (não incluída).
name: Android build

on:
  workflow_dispatch: {}

# Escrita no repositório só para publicar o APK em Releases (link direto).
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NDOMBAXI_API_URL: https://ndombaxi-api-3nmz.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          # Clone completo: a versão da build é o nº de commits (scripts/ci-version.mjs).
          fetch-depth: 0
      # REGRA PERMANENTE: cada build publicada tem versão maior → bloqueia as anteriores.
      - name: Versão automática desta build
        shell: bash
        run: node scripts/ci-version.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Compilar pacotes partilhados
        run: |
          pnpm --filter @nexus/types build
          pnpm --filter @nexus/update-core build
          pnpm --filter @nexus/shop-link build
      - name: Preparar web e projeto Android
        run: |
          node apps/mobile-shell/scripts/prepare-web.mjs
          pnpm --filter @nexus/mobile-shell exec cap add android || true
          # Versão do produto no APK (versionName/versionCode). Tem de ser DEPOIS do
          # cap add: antes, o projeto Android ainda não existe e o APK saía "1.0".
          node apps/mobile-shell/scripts/sync-android-version.mjs
          pnpm --filter @nexus/mobile-shell exec cap sync android
          # Ícones a partir do logótipo único (apps/web/public/logo.png, sem fundo).
          node apps/mobile-shell/scripts/gen-android-icons.mjs
          # Ecrã inteiro (imersivo): sem barra de estado nem de navegação.
          node apps/mobile-shell/scripts/patch-android.mjs
      - name: Assinatura estável
        # Cada runner criava uma debug.keystore NOVA → cada APK tinha assinatura
        # diferente e o Android recusava instalar por cima da versão anterior
        # ("App não instalada"). Usamos sempre a mesma chave de depuração.
        run: |
          mkdir -p ~/.android
          cp apps/mobile-shell/keystore/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK debug
        working-directory: apps/mobile-shell/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ndombaxi-android-debug
          path: apps/mobile-shell/android/app/build/outputs/apk/debug/*.apk
      # Link DIRETO (os Artifacts não aparecem na app GitHub do telemóvel).
      # A release `android-latest` é substituída a cada build:
      #   https://github.com/<dono>/<repo>/releases/download/android-latest/LPSVendas-Android.apk
      - name: Publicar APK (Releases → android-latest)
        working-directory: apps/mobile-shell/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls *.apk | head -1)
          cp "$apk" LPSVendas-Android.apk
          gh release delete android-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create android-latest LPSVendas-Android.apk \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "LPS Vendas para Android (mais recente)" \
            --notes "APK do LPS Vendas para Android. Versão: ${APP_VERSION}. Commit ${GITHUB_SHA::7}, build #${GITHUB_RUN_NUMBER}. Para instalar: abrir o ficheiro no telemóvel e permitir 'instalar apps desconhecidas' para o navegador."
      # O servidor lê esta release do GitHub e passa a exigir esta versão: as
      # apps antigas ficam bloqueadas (com o botão para o site oficial). Se o
      # aviso falhar, o servidor apanha-a sozinho em <= 10 minutos.
      - name: Bloquear versões anteriores (avisar o servidor)
        shell: bash
        run: |
          curl -fsS -X POST --max-time 90 "${NDOMBAXI_API_URL:-https://ndombaxi-api-3nmz.onrender.com}/downloads/sync" || echo "Servidor indisponível agora — sincroniza sozinho em até 10 min."
