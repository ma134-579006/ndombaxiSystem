# Compila a app iOS (Ndombaxi System) num Mac NA NUVEM — GitHub Actions macOS
# runner. É o caminho LEGÍTIMO para gerar o .ipa sem ter um Mac físico (a Apple
# só permite compilar iOS em macOS; aqui usamos o macOS oficial do GitHub).
#
# ─────────────────────────────────────────────────────────────────────────────
# COMO USAR
#   1. Faça commit/push deste repositório para o GitHub.
#   2. Aba "Actions" → "iOS build" → "Run workflow".
#   3. SEM secrets de assinatura → gera um build de TESTE (não instalável em
#      iPhone, serve para confirmar que compila).
#   4. COM os secrets abaixo (precisa de conta Apple Developer, 99 USD/ano) →
#      gera um .ipa ASSINADO e instalável, publicado como "artifact".
#
# SECRETS A DEFINIR (Settings → Secrets and variables → Actions), quando tiver
# a conta Apple Developer:
#   APPLE_TEAM_ID              — Team ID (10 caracteres) da conta Apple Developer
#   IOS_CERTIFICATE_BASE64     — o certificado de distribuição (.p12) em base64
#   IOS_CERTIFICATE_PASSWORD   — a password do .p12
#   IOS_PROVISION_BASE64       — o provisioning profile (.mobileprovision) em base64
#   IOS_BUNDLE_ID              — normalmente com.ndombaxi.system
# ─────────────────────────────────────────────────────────────────────────────

name: iOS build

on:
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-14
    env:
      NDOMBAXI_API_URL: https://ndombaxi-api-img.onrender.com
      # Mapeado ao job para os `if:` conseguirem detetar se há assinatura.
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar web (frontends + lançador + seta de voltar) e projeto iOS
        run: |
          node apps/mobile-shell/scripts/prepare-web.mjs
          pnpm --filter @nexus/mobile-shell exec cap add ios || true
          pnpm --filter @nexus/mobile-shell exec cap sync ios

      - name: CocoaPods
        working-directory: apps/mobile-shell/ios/App
        run: pod install

      # ── Assinatura (só se os secrets existirem) ──────────────────────────────
      - name: Preparar assinatura (keychain + provisioning)
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/app.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" || true
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISION_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/ndombaxi.mobileprovision"

      - name: Compilar .ipa (assinado)
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        working-directory: apps/mobile-shell/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" archive
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      # ── Sem secrets: build de TESTE (não assinado) só para confirmar que compila ─
      - name: Compilar build de teste (não assinado)
        if: ${{ env.IOS_CERTIFICATE_BASE64 == '' }}
        working-directory: apps/mobile-shell/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NdombaxiSystem-ios
          path: |
            ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn
