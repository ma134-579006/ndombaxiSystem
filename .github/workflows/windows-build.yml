# Compila o instalador Windows (LPS Vendas, Windows 10/11 x64) na nuvem.
# Manual: Actions → "Windows build" → Run workflow. Resultado: artefacto
# `lps-vendas-windows` com LPSVendas-Setup-<versão>-x64.exe (sem assinatura
# digital → o SmartScreen avisa na primeira instalação).
name: Windows build

on:
  workflow_dispatch: {}

# Escrita no repositório só para publicar o instalador em Releases (link direto).
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      NDOMBAXI_API_URL: https://ndombaxi-api-3nmz.onrender.com
      PG_URL: https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64-binaries.zip
    steps:
      - uses: actions/checkout@v4
        with:
          # Clone completo: a versão da build é o nº de commits (scripts/ci-version.mjs).
          fetch-depth: 0
      # REGRA PERMANENTE: cada build publicada tem versão maior → bloqueia as anteriores.
      - name: Versão automática desta build
        shell: bash
        run: node scripts/ci-version.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: better-sqlite3 para o ABI do Electron
        shell: bash
        working-directory: apps/desktop
        run: |
          cd "$(node -p "require('path').dirname(require.resolve('better-sqlite3/package.json'))")"
          npx --yes prebuild-install@7 --runtime=electron --target=33.4.11 --arch=x64 --force
      - name: PostgreSQL portátil (só bin, lib, share)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PG_URL -OutFile pg.zip
          Expand-Archive pg.zip -DestinationPath pg-tmp
          $dest = 'apps/desktop/resources/pgsql'
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($p in 'bin','lib','share') { Move-Item "pg-tmp/pgsql/$p" "$dest/$p" }
          if (-not (Test-Path "$dest/bin/postgres.exe")) { throw 'postgres.exe em falta' }
      - name: Compilar pacotes partilhados
        run: |
          pnpm --filter @nexus/types build
          pnpm --filter @nexus/update-core build
          pnpm --filter @nexus/shop-link build
          pnpm --filter @nexus/replication build
          pnpm --filter @nexus/local-server build
      - name: Compilar app (frontends, API local, ícones)
        run: pnpm --filter @nexus/desktop build
      - name: Gerar instalador
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lps-vendas-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
      # Link DIRETO para o lojista: os "Artifacts" só aparecem no fundo da página
      # do Actions (e nunca na app GitHub do telemóvel). A release
      # `windows-latest` é substituída a cada build; o ficheiro com nome fixo dá
      # um link que nunca muda:
      #   https://github.com/<dono>/<repo>/releases/download/windows-latest/LPSVendas-Setup-x64.exe
      - name: Publicar instalador (Releases → windows-latest)
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Só se publica a partir de main e nunca uma versão MAIS BAIXA do que a
          # publicada (senão o ficheiro descarregado seria uma versão já bloqueada).
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Só se publica a partir de main (ref: $GITHUB_REF)."; exit 1; fi
          cur=$(gh release view windows-latest -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -oE 'Vers[^:]*: [0-9]+\.[0-9]+\.[0-9]+' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$cur" ] && [ "$(printf '%s\n%s\n' "$cur" "$APP_VERSION" | sort -V | tail -1)" != "$APP_VERSION" ]; then
            echo "::error::Versão $APP_VERSION é mais baixa do que a publicada ($cur) — não se substitui."; exit 1
          fi
          exe=$(ls LPSVendas-Setup-*-x64.exe | head -1)
          cp "$exe" LPSVendas-Setup-x64.exe
          gh release delete windows-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create windows-latest "$exe" LPSVendas-Setup-x64.exe \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "LPS Vendas para Windows (mais recente)" \
            --notes "Instalador do LPS Vendas para Windows 10/11 (64 bits). Versão: ${APP_VERSION}. Commit ${GITHUB_SHA::7}, build #${GITHUB_RUN_NUMBER}. Sem assinatura digital: na primeira instalação o Windows avisa — Mais informações → Executar mesmo assim."
      # O servidor lê esta release do GitHub e passa a exigir esta versão: as
      # apps antigas ficam bloqueadas (com o botão para o site oficial). Se o
      # aviso falhar, o servidor apanha-a sozinho em <= 10 minutos.
      - name: Bloquear versões anteriores (avisar o servidor)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          curl -fsS -X POST --max-time 90 "${NDOMBAXI_API_URL:-https://ndombaxi-api-3nmz.onrender.com}/downloads/sync" || echo "Servidor indisponível agora — sincroniza sozinho em até 10 min."
